{% extends "shared/admin_base.html" %}
{% block custom_styles %}<style>
.filter-card{margin-bottom:1.5rem}.chart-card .card-body{padding:0}#ime-chart{height:600px;width:100%}.status{min-height:1.4rem}
</style>{% endblock %}
{% block content %}
<div class="card filter-card"><div class="card-header"><h3 class="card-title">Price / Volume Filter</h3></div><div class="card-body">
<div class="row g-3 align-items-end">
<div class="col-md-3"><label class="form-label">Company</label><select id="ime-producer" class="form-select">{% for p in producers %}<option value="{{ p.producer_code }}" {% if selected_producer_code == p.producer_code %}selected{% endif %}>{{ p.name }} ({{ p.producer_code }})</option>{% else %}<option value="">No enabled producers</option>{% endfor %}</select></div>
<div class="col-md-3"><label class="form-label">Product</label><select id="ime-product" class="form-select"><option value="">Load a company first</option></select></div>
<div class="col-md-2"><label class="form-label">From</label><input id="ime-from" type="date" class="form-control"></div>
<div class="col-md-2"><label class="form-label">To</label><input id="ime-to" type="date" class="form-control"></div>
<div class="col-md-2"><button id="ime-load" class="btn btn-primary w-100">Load</button></div>
</div><div id="ime-status" class="status text-muted small mt-2">Select filters and click Load.</div></div></div>
<div class="card chart-card"><div class="card-header"><h3 class="card-title">IME Price (toman) & Volume</h3></div><div class="card-body"><div id="ime-chart"></div></div></div>
{% endblock %}
{% block custom_js %}
{% include "shared/echarts_support.html" %}
<script>(function(){"use strict";
var producer=document.getElementById('ime-producer'),product=document.getElementById('ime-product'),from=document.getElementById('ime-from'),to=document.getElementById('ime-to'),button=document.getElementById('ime-load'),status=document.getElementById('ime-status'),chart=AdminCharts.init(document.getElementById('ime-chart'));
function iso(d){return d.toISOString().slice(0,10)}var now=new Date(),past=new Date(now);past.setFullYear(now.getFullYear()-3);from.value=iso(past);to.value=iso(now);
function setStatus(text,error){status.textContent=text;status.classList.toggle('text-danger',!!error)}function empty(text){AdminCharts.showEmpty(chart,text)}function num(v,d){return Number(v).toLocaleString('fa-IR',{maximumFractionDigits:d||0})}function volumeAxisMax(v){return v.max>0?v.max/.3:1}
function loadProducts(){var code=producer.value;product.innerHTML='<option value="">Loading…</option>';if(!code){product.innerHTML='<option value="">No enabled producer</option>';return Promise.resolve();}return fetch('/admin/api/ime/products?producer_code='+encodeURIComponent(code)).then(function(r){if(!r.ok)throw new Error('HTTP '+r.status);return r.json()}).then(function(data){product.innerHTML='';(data.products||[]).forEach(function(p){var o=document.createElement('option');o.value=p.symbol;o.textContent=p.goods_name+' ('+p.symbol+')';product.appendChild(o)});if(!data.products.length)product.innerHTML='<option value="">No collected products</option>'}).catch(function(e){product.innerHTML='<option value="">Failed to load</option>';setStatus(e.message,true)})}
function render(data){chart.clear();var points=data.points||[];if(!points.length){empty('No trade rows for this range.');return}function pointKey(p){return p.jalali_date+'|'+p.offer_id+'|'+p.source_trade_pk}var keys=[],seen={};points.forEach(function(p){var k=pointKey(p);if(!seen[k]){seen[k]=true;keys.push(k)}});var contracts=[];points.forEach(function(p){if(contracts.indexOf(p.contract_type)<0)contracts.push(p.contract_type)});var colors=['#2563eb','#f59f00','#7c3aed','#0ca678'],series=[];
contracts.forEach(function(contract,idx){var by={};points.filter(function(p){return p.contract_type===contract}).forEach(function(p){by[pointKey(p)]=p});var price=keys.map(function(k){var p=by[k];return p?{value:p.price_toman,meta:p}:null});var volume=keys.map(function(k){var p=by[k];return p?{value:p.quantity,meta:p}:null});series.push({name:contract+' price',type:'line',yAxisIndex:0,data:price,connectNulls:true,showSymbol:true,symbolSize:7,itemStyle:{color:colors[idx%colors.length]},lineStyle:{width:2}});series.push({name:contract+' volume',type:'bar',yAxisIndex:1,data:volume,itemStyle:{color:colors[idx%colors.length],opacity:.28},barMaxWidth:24})});
chart.setOption({grid:AdminCharts.grid(),legend:{type:'scroll'},tooltip:{trigger:'axis',formatter:function(params){var rows=params.filter(function(p){return p.seriesType==='line'&&p.data&&p.data.meta});if(!rows.length)return '';var html='<b>'+rows[0].data.meta.jalali_date+' / '+rows[0].data.meta.trade_date+'</b>';rows.forEach(function(x){var m=x.data.meta;html+='<br><b>'+m.contract_type+'</b>'+'<br>Offer: '+m.offer_id+'<br>Price: '+num(m.price_toman,0)+' تومان'+'<br>Volume: '+num(m.quantity,3)+' '+m.unit});return html}},xAxis:{type:'category',data:keys,axisLabel:{formatter:function(v){return v.split('|')[0]}}},yAxis:[{type:'log',logBase:10,name:'Price (toman, log)',axisLabel:{formatter:function(v){return num(v,0)}}},{type:'value',name:'Volume',position:'right',max:volumeAxisMax,splitLine:{show:false}}],dataZoom:AdminCharts.dualAxisZoom(),series:series});}
function load(){if(!producer.value||!product.value||!from.value||!to.value){setStatus('Company, product and date range are required.',true);return}var q='producer_code='+encodeURIComponent(producer.value)+'&symbol='+encodeURIComponent(product.value)+'&from='+encodeURIComponent(from.value)+'&to='+encodeURIComponent(to.value);setStatus('Loading…');empty('Loading…');fetch('/admin/api/ime/price-volume?'+q).then(function(r){if(!r.ok)return r.json().then(function(x){throw new Error(x.detail||('HTTP '+r.status))});return r.json()}).then(function(data){render(data);setStatus((data.points||[]).length+' trade row(s) — price is reported by IME; no VWAP recomputation.')}).catch(function(e){empty('Failed to load.');setStatus(e.message,true)})}
producer.addEventListener('change',loadProducts);button.addEventListener('click',load);loadProducts().then(function(){if(product.value)load()});empty('Select filters and click Load.');
})();</script>
{% endblock %}
