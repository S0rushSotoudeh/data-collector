{% extends "admin_base.html" %}
{% block custom_styles %}
<style>
  .filter-card { margin-bottom: 1.5rem; }
  .filter-card .card-body { padding: 1rem 1.5rem; }
  .chart-card { height: 620px; }
  .chart-card .card-body { padding: 0; }
  #btr-chart { width: 100%; height: 620px; }
  .empty-state {
    display: flex; align-items: center; justify-content: center;
    height: 100%; color: var(--tblr-muted, #64748b); font-size: .95rem;
  }
</style>
{% endblock %}
{% block content %}

<div class="card filter-card">
  <div class="card-header"><h3 class="card-title">Ranking Filter</h3></div>
  <div class="card-body">
    <div class="row g-3 align-items-end">
      <div class="col-md-3">
        <label class="form-label">From date</label>
        <input type="date" id="btr-from" class="form-control">
      </div>
      <div class="col-md-3">
        <label class="form-label">To date</label>
        <input type="date" id="btr-to" class="form-control">
      </div>
      <div class="col-md-2">
        <label class="form-label">Top N</label>
        <input type="number" id="btr-topn" class="form-control" value="15" min="1" max="100">
      </div>
      <div class="col-md-2 align-self-end">
        <button type="button" id="btr-load" class="btn btn-primary w-100">Load</button>
      </div>
    </div>
    <div class="row mt-2">
      <div class="col-12 text-muted small" id="btr-status">Select date range and click Load.</div>
    </div>
  </div>
</div>

<div class="card chart-card">
  <div class="card-header"><h3 class="card-title">Ranking by Total Value</h3></div>
  <div class="card-body">
    <div id="btr-chart"></div>
  </div>
</div>

{% endblock %}
{% block custom_js %}
<script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
<script>
(function () {
  "use strict";

  var state = { chart: null };

  var instruments = {{ instruments | tojson }};
  var codeToSymbol = {};
  for (var i = 0; i < instruments.length; i++) {
    codeToSymbol[instruments[i].instrument_code] = instruments[i].symbol;
  }

  var chartEl = document.getElementById("btr-chart");
  var statusEl = document.getElementById("btr-status");
  var fromInput = document.getElementById("btr-from");
  var toInput = document.getElementById("btr-to");
  var topNInput = document.getElementById("btr-topn");
  var loadBtn = document.getElementById("btr-load");

  function ensureChart() {
    if (!state.chart) {
      state.chart = echarts.init(chartEl);
      window.addEventListener("resize", function () { if (state.chart) state.chart.resize(); });
    }
    return state.chart;
  }

  function setStatus(msg, isErr) {
    statusEl.textContent = msg;
    statusEl.classList.toggle("text-danger", !!isErr);
  }

  function showEmpty(msg) {
    var chart = ensureChart();
    chart.clear();
    chart.setOption({
      title: { text: msg, left: "center", top: "center", textStyle: { color: "#94a3b8", fontWeight: "normal", fontSize: 14 } }
    });
  }

  function fmtNum(v, d) {
    if (v === null || v === undefined || isNaN(v)) return "—";
    return Number(v).toFixed(d == null ? 2 : d);
  }

  function renderRanking(data) {
    var chart = ensureChart();
    chart.clear();
    var rows = data.rows || [];
    if (rows.length === 0) {
      showEmpty("No trades in this period.");
      return;
    }

    var topN = parseInt(topNInput.value) || 15;
    var sliced = rows.slice(0, topN);
    var restRows = rows.slice(topN);

    var labels = [];
    var values = [];
    for (var j = 0; j < sliced.length; j++) {
      var code = sliced[j].instrument_code;
      var sym = codeToSymbol[code] || code;
      labels.push(sym);
      values.push(sliced[j].value / 1e9);
    }

    if (restRows.length > 0) {
      var restSum = 0;
      for (var k = 0; k < restRows.length; k++) {
        restSum += restRows[k].value;
      }
      labels.push("rest (" + restRows.length + ")");
      values.push(restSum / 1e9);
    }

    var option = {
      grid: { left: 120, right: 40, top: 24, bottom: 40 },
      tooltip: {
        trigger: "item",
        formatter: function (p) {
          return p.name + "<br>value: " + fmtNum(p.value, 2) + " billion";
        }
      },
      xAxis: {
        type: "value",
        name: "value (billions)",
        nameLocation: "middle",
        nameGap: 28
      },
      yAxis: {
        type: "category",
        data: labels,
        inverse: true,
        axisLabel: { fontSize: 11 }
      },
      series: [{
        type: "bar",
        data: values,
        itemStyle: {
          color: function (p) {
            var idx = p.dataIndex;
            if (restRows.length > 0 && idx === labels.length - 1) return "#94a3b8";
            return "#2563eb";
          }
        },
        label: {
          show: true,
          position: "right",
          formatter: function (p) { return fmtNum(p.value, 2) + "B"; },
          fontSize: 11
        }
      }]
    };
    chart.setOption(option);
  }

  function loadRanking() {
    var fromD = fromInput.value;
    var toD = toInput.value;
    if (!fromD || !toD) {
      setStatus("From and to dates are required.", true);
      return;
    }
    var params = "from=" + encodeURIComponent(fromD) + "&to=" + encodeURIComponent(toD);
    setStatus("Loading ranking\u2026");
    showEmpty("Loading\u2026");
    fetch("/api/v1/bond-trades-values/ranking?" + params)
      .then(function (r) { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
      .then(function (data) {
        renderRanking(data);
        var n = (data.rows || []).length;
        setStatus(fromD + " \u2192 " + toD + " \u2014 " + n + " instrument(s).");
      })
      .catch(function (err) {
        showEmpty("Failed to load: " + err.message);
        setStatus("Error: " + err.message, true);
      });
  }

  loadBtn.addEventListener("click", loadRanking);

  showEmpty("Select date range and click Load.");
})();
</script>
{% endblock %}
