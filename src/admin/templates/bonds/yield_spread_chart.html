{% extends "shared/admin_base.html" %}
{% block custom_styles %}
<style>
  .filter-card { margin-bottom: 1.5rem; }
  .filter-card .card-body { padding: 1rem 1.5rem; }
  .chart-card { height: 560px; }
  .chart-card .card-body { padding: 0; }
  #ys-chart { width: 100%; height: 560px; }
  .empty-state {
    display: flex; align-items: center; justify-content: center;
    height: 100%; color: var(--tblr-muted, #64748b); font-size: .95rem;
  }
  .side-dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: .35rem; vertical-align: middle; }
  .side-bid { background: #2563eb; }
  .side-ask { background: #dc2626; }
  .mode-group .btn { cursor: pointer; }
  .field-intraday, .field-daily { display: none; }
  .field-intraday.active, .field-daily.active { display: flex; }
</style>
{% endblock %}
{% block content %}

<div class="card filter-card">
  <div class="card-header"><h3 class="card-title">Spread Filter</h3></div>
  <div class="card-body">
    <div class="row g-3 align-items-end">
      <div class="col-md-3">
        <label class="form-label">Mode</label>
        <div class="btn-group mode-group w-100" role="group">
          <input type="radio" class="btn-check" name="ys-mode" id="ys-mode-intraday" value="intraday" checked>
          <label class="btn btn-outline-primary" for="ys-mode-intraday">Intraday</label>
          <input type="radio" class="btn-check" name="ys-mode" id="ys-mode-daily" value="daily">
          <label class="btn btn-outline-primary" for="ys-mode-daily">Daily</label>
        </div>
      </div>
      <div class="col-md-3">
        <label class="form-label">Instrument</label>
        <select id="ys-instrument" class="form-select" name="instrument">
          {% if instruments|length == 0 %}
            <option value="">— no instruments —</option>
          {% else %}
            {% for i in instruments %}
            <option value="{{ i.instrument_code }}">{{ i.symbol }}</option>
            {% endfor %}
          {% endif %}
        </select>
      </div>
      <div class="col-md-2">
        <label class="form-label">Side</label>
        <select id="ys-side" class="form-select" name="side">
          <option value="both" selected>both</option>
          <option value="bid"><span class="side-dot side-bid"></span>bid</option>
          <option value="ask"><span class="side-dot side-ask"></span>ask</option>
        </select>
      </div>

      <div class="col-md-2 field-intraday active">
        <label class="form-label">Date</label>
        <input type="date" id="ys-date" class="form-control" name="date">
      </div>
      <div class="col-md-2 field-intraday active">
        <label class="form-label">From time (HHMMSS)</label>
        <input type="number" id="ys-from-time" class="form-control" name="from_time" placeholder="090000" min="0" max="235959">
      </div>
      <div class="col-md-2 field-intraday active">
        <label class="form-label">To time (HHMMSS)</label>
        <input type="number" id="ys-to-time" class="form-control" name="to_time" placeholder="150000" min="0" max="235959">
      </div>

      <div class="col-md-2 field-daily">
        <label class="form-label">From date</label>
        <input type="date" id="ys-from-date" class="form-control" name="from">
      </div>
      <div class="col-md-2 field-daily">
        <label class="form-label">To date</label>
        <input type="date" id="ys-to-date" class="form-control" name="to">
      </div>

      <div class="col-md-2 align-self-end">
        <button type="button" id="ys-load" class="btn btn-primary w-100">Load</button>
      </div>
    </div>
    <div class="row mt-2">
      <div class="col-12 text-muted small" id="ys-status">Select filters and click Load.</div>
    </div>
  </div>
</div>

<div class="card chart-card">
  <div class="card-header"><h3 class="card-title">Spread (bps)</h3></div>
  <div class="card-body">
    <div id="ys-chart"></div>
  </div>
</div>

{% endblock %}
{% block custom_js %}
{% include "shared/echarts_support.html" %}
<script>
(function () {
  "use strict";

  var state = { chart: null };
  var COLORS = { bid: "#2563eb", ask: "#dc2626" };
  var SIDES = ["bid", "ask"];

  var chartEl = document.getElementById("ys-chart");
  var statusEl = document.getElementById("ys-status");
  var modeIntraday = document.getElementById("ys-mode-intraday");
  var modeDaily = document.getElementById("ys-mode-daily");
  var instrumentSel = document.getElementById("ys-instrument");
  var sideSel = document.getElementById("ys-side");
  var dateInput = document.getElementById("ys-date");
  var fromTimeInput = document.getElementById("ys-from-time");
  var toTimeInput = document.getElementById("ys-to-time");
  var fromDateInput = document.getElementById("ys-from-date");
  var toDateInput = document.getElementById("ys-to-date");
  var loadBtn = document.getElementById("ys-load");

  function ensureChart() {
    if (!state.chart) {
      state.chart = AdminCharts.init(chartEl);
    }
    return state.chart;
  }

  function setStatus(msg, isErr) {
    statusEl.textContent = msg;
    statusEl.classList.toggle("text-danger", !!isErr);
  }

  function showEmpty(msg) {
    AdminCharts.showEmpty(ensureChart(), msg);
  }

  function fmtNum(v, d) {
    if (v === null || v === undefined || isNaN(v)) return "—";
    return Number(v).toFixed(d == null ? 2 : d);
  }
  function fmtTime(t) {
    return String(t).padStart(6, "0").replace(/(\d{2})(\d{2})(\d{2})/, "$1:$2:$3");
  }

  function activeSides() {
    var s = sideSel.value;
    if (s === "both") return SIDES;
    return [s];
  }

  function renderIntraday(data) {
    var chart = ensureChart();
    chart.clear();
    var points = data.points || [];
    if (points.length === 0) {
      showEmpty("No spread points for this filter.");
      return;
    }

    var sides = activeSides();
    var seriesBySide = {};
    sides.forEach(function (s) { seriesBySide[s] = []; });
    points.forEach(function (p) {
      if (seriesBySide[p.curve_side]) {
        seriesBySide[p.curve_side].push([p.trade_time, p.spread_bps]);
      }
    });

    var series = [];
    sides.forEach(function (s) {
      if (seriesBySide[s].length === 0) return;
      series.push({
        name: s + " spread",
        type: "line",
        data: seriesBySide[s],
        showSymbol: true,
        symbolSize: 5,
        smooth: false,
        lineStyle: { color: COLORS[s], width: 2 },
        itemStyle: { color: COLORS[s] },
        z: 3
      });
    });

    var option = {
      grid: AdminCharts.grid(),
      tooltip: {
        trigger: "item",
        formatter: function (p) {
          var v = p.value;
          return p.seriesName + "<br>time: " + fmtTime(v[0]) + "<br>spread: " + fmtNum(v[1], 1) + " bps";
        }
      },
      legend: { top: 4 },
      xAxis: {
        type: "value",
        name: "Trade time",
        nameLocation: "middle",
        nameGap: 32,
        axisLabel: { formatter: function (v) { return fmtTime(v); } }
      },
      yAxis: {
        type: "value",
        name: "spread (bps)",
        scale: true,
        axisLabel: { formatter: function (v) { return fmtNum(v, 1); } }
      },
      dataZoom: AdminCharts.dualAxisZoom(),
      series: series
    };
    chart.setOption(option);
  }

  function renderDaily(data) {
    var chart = ensureChart();
    chart.clear();
    var days = data.days || [];
    if (days.length === 0) {
      showEmpty("No spread days for this filter.");
      return;
    }

    var sides = activeSides();
    var dateList = [];
    var dateIndex = {};
    var metaBySideDate = {};
    days.forEach(function (d) {
      var ds = d.trade_date;
      if (!(ds in dateIndex)) {
        dateIndex[ds] = dateList.length;
        dateList.push(ds);
      }
      metaBySideDate[ds + "|" + d.curve_side] = { mean: d.mean, n: d.n, box: d.box };
    });

    var boxBySide = {}, outliersBySide = {};
    sides.forEach(function (s) {
      boxBySide[s] = new Array(dateList.length).fill(null);
      outliersBySide[s] = [];
    });

    days.forEach(function (d) {
      if (boxBySide[d.curve_side] === undefined) return;
      var idx = dateIndex[d.trade_date];
      var box = d.box;
      boxBySide[d.curve_side][idx] = (box === null || box === undefined) ? null : box;
      (d.outliers || []).forEach(function (o) {
        outliersBySide[d.curve_side].push([idx, o]);
      });
    });

    var series = [];
    sides.forEach(function (s) {
      var data = [];
      boxBySide[s].forEach(function (b, i) {
        if (b === null) return;
        data.push({ value: b, name: dateList[i] });
      });
      if (data.length === 0) return;
      series.push({
        name: s + " spread",
        type: "boxplot",
        data: data,
        itemStyle: { color: COLORS[s], borderColor: COLORS[s], opacity: 0.55 }
      });
      if (outliersBySide[s].length > 0) {
        series.push({
          name: s + " outliers",
          type: "scatter",
          data: outliersBySide[s],
          symbolSize: 5,
          itemStyle: { color: COLORS[s] },
          z: 5
        });
      }
    });

    var option = {
      grid: AdminCharts.grid(),
      tooltip: {
        trigger: "item",
        formatter: function (p) {
          var ds = p.name || "—";
          if (p.seriesType === "scatter") {
            return (p.name || dateList[p.value[0]] || "—") + "<br>" + p.seriesName + "<br>outlier: " + fmtNum(p.value[1], 1) + " bps";
          }
          var b = p.value;
          if (b === null || b[0] === null) return ds + "<br>no data";
          var side = p.seriesName.replace(" spread", "");
          var meta = metaBySideDate[ds + "|" + side] || {};
          var lines = [ds, "<b>" + p.seriesName + "</b>"];
          lines.push("min: " + fmtNum(b[0], 1) + " bps");
          lines.push("Q1: " + fmtNum(b[1], 1) + " bps");
          lines.push("median: " + fmtNum(b[2], 1) + " bps");
          lines.push("Q3: " + fmtNum(b[3], 1) + " bps");
          lines.push("max: " + fmtNum(b[4], 1) + " bps");
          lines.push("mean: " + fmtNum(meta.mean, 1) + " bps");
          lines.push("n: " + (meta.n == null ? "—" : meta.n));
          return lines.join("<br>");
        }
      },
      legend: { top: 4 },
      xAxis: {
        type: "category",
        data: dateList,
        name: "Trade date",
        nameLocation: "middle",
        nameGap: 32
      },
      yAxis: {
        type: "value",
        name: "spread (bps)",
        scale: true,
        axisLabel: { formatter: function (v) { return fmtNum(v, 1); } }
      },
      dataZoom: AdminCharts.dualAxisZoom(),
      series: series
    };
    chart.setOption(option);
  }

  function loadIntraday() {
    var instrument = instrumentSel.value;
    var date = dateInput.value;
    var side = sideSel.value;
    if (!instrument || !date) {
      setStatus("Instrument and date are required for intraday mode.", true);
      return;
    }
    var params = "instrument=" + encodeURIComponent(instrument) + "&date=" + encodeURIComponent(date) + "&side=" + encodeURIComponent(side);
    var ft = fromTimeInput.value.trim();
    var tt = toTimeInput.value.trim();
    if (ft) params += "&from_time=" + encodeURIComponent(ft);
    if (tt) params += "&to_time=" + encodeURIComponent(tt);
    setStatus("Loading intraday spread…");
    showEmpty("Loading…");
    fetch("/api/v1/yield-spread/intraday?" + params)
      .then(function (r) { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
      .then(function (data) {
        renderIntraday(data);
        var n = (data.points || []).length;
        setStatus("Intraday " + instrument + " " + date + " — " + n + " point(s).");
      })
      .catch(function (err) {
        showEmpty("Failed to load: " + err.message);
        setStatus("Error: " + err.message, true);
      });
  }

  function loadDaily() {
    var instrument = instrumentSel.value;
    var fromD = fromDateInput.value;
    var toD = toDateInput.value;
    var side = sideSel.value;
    if (!instrument || !fromD || !toD) {
      setStatus("Instrument, from and to dates are required for daily mode.", true);
      return;
    }
    var params = "instrument=" + encodeURIComponent(instrument) +
      "&from=" + encodeURIComponent(fromD) +
      "&to=" + encodeURIComponent(toD) +
      "&side=" + encodeURIComponent(side);
    setStatus("Loading daily spread…");
    showEmpty("Loading…");
    fetch("/api/v1/yield-spread/daily?" + params)
      .then(function (r) { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
      .then(function (data) {
        renderDaily(data);
        var n = (data.days || []).length;
        setStatus("Daily " + instrument + " " + fromD + " → " + toD + " — " + n + " day-side(s).");
      })
      .catch(function (err) {
        showEmpty("Failed to load: " + err.message);
        setStatus("Error: " + err.message, true);
      });
  }

  function onModeChange() {
    var intraday = modeIntraday.checked;
    document.querySelectorAll(".field-intraday").forEach(function (el) { el.classList.toggle("active", intraday); });
    document.querySelectorAll(".field-daily").forEach(function (el) { el.classList.toggle("active", !intraday); });
  }

  modeIntraday.addEventListener("change", onModeChange);
  modeDaily.addEventListener("change", onModeChange);
  loadBtn.addEventListener("click", function () {
    if (modeIntraday.checked) loadIntraday(); else loadDaily();
  });

  showEmpty("Select filters and click Load.");
})();
</script>
{% endblock %}
