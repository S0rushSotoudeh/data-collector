{% extends "shared/admin_base.html" %}
{% block custom_styles %}
<style>
  .filter-card { margin-bottom: 1.5rem; }
  .filter-card .card-body { padding: 1rem 1.5rem; }
  .chart-card { height: 560px; }
  .chart-card .card-body { padding: 0; }
  #btv-chart { width: 100%; height: 560px; }
  .empty-state {
    display: flex; align-items: center; justify-content: center;
    height: 100%; color: var(--tblr-muted, #64748b); font-size: .95rem;
  }
  .mode-group .btn { cursor: pointer; }
  .field-intraday, .field-daily { display: none; }
  .field-intraday.active, .field-daily.active { display: flex; }
</style>
{% endblock %}
{% block content %}

<div class="card filter-card">
  <div class="card-header"><h3 class="card-title">Trades Values Filter</h3></div>
  <div class="card-body">
    <div class="row g-3 align-items-end">
      <div class="col-md-3">
        <label class="form-label">Mode</label>
        <div class="btn-group mode-group w-100" role="group">
          <input type="radio" class="btn-check" name="btv-mode" id="btv-mode-intraday" value="intraday" checked>
          <label class="btn btn-outline-primary" for="btv-mode-intraday">Intraday</label>
          <input type="radio" class="btn-check" name="btv-mode" id="btv-mode-daily" value="daily">
          <label class="btn btn-outline-primary" for="btv-mode-daily">Daily</label>
        </div>
      </div>
      <div class="col-md-3">
        <label class="form-label">Instrument</label>
        <select id="btv-instrument" class="form-select" name="instrument">
          {% if instruments|length == 0 %}
            <option value="">— no instruments —</option>
          {% else %}
            {% for i in instruments %}
            <option value="{{ i.instrument_code }}">{{ i.symbol }}</option>
            {% endfor %}
          {% endif %}
        </select>
      </div>

      <div class="col-md-2 field-intraday active">
        <label class="form-label">Date</label>
        <input type="date" id="btv-date" class="form-control" name="date">
      </div>
      <div class="col-md-2 field-intraday active">
        <label class="form-label">From time (HHMMSS)</label>
        <input type="number" id="btv-from-time" class="form-control" name="from_time" placeholder="090000" min="0" max="235959">
      </div>
      <div class="col-md-2 field-intraday active">
        <label class="form-label">To time (HHMMSS)</label>
        <input type="number" id="btv-to-time" class="form-control" name="to_time" placeholder="150000" min="0" max="235959">
      </div>
      <div class="col-md-2 field-intraday active">
        <label class="form-label">Limit</label>
        <input type="number" id="btv-limit" class="form-control" name="limit" value="2000" min="1" max="20000">
      </div>

      <div class="col-md-2 field-daily">
        <label class="form-label">From date</label>
        <input type="date" id="btv-from-date" class="form-control" name="from">
      </div>
      <div class="col-md-2 field-daily">
        <label class="form-label">To date</label>
        <input type="date" id="btv-to-date" class="form-control" name="to">
      </div>

      <div class="col-md-2 align-self-end">
        <button type="button" id="btv-load" class="btn btn-primary w-100">Load</button>
      </div>
    </div>
    <div class="row mt-2">
      <div class="col-12 text-muted small" id="btv-status">Select filters and click Load.</div>
    </div>
  </div>
</div>

<div class="card chart-card">
  <div class="card-header"><h3 class="card-title">Price / Value</h3></div>
  <div class="card-body">
    <div id="btv-chart"></div>
  </div>
</div>

{% endblock %}
{% block custom_js %}
{% include "shared/echarts_support.html" %}
<script>
(function () {
  "use strict";

  var state = { chart: null };

  var chartEl = document.getElementById("btv-chart");
  var statusEl = document.getElementById("btv-status");
  var modeIntraday = document.getElementById("btv-mode-intraday");
  var modeDaily = document.getElementById("btv-mode-daily");
  var instrumentSel = document.getElementById("btv-instrument");
  var dateInput = document.getElementById("btv-date");
  var fromTimeInput = document.getElementById("btv-from-time");
  var toTimeInput = document.getElementById("btv-to-time");
  var limitInput = document.getElementById("btv-limit");
  var fromDateInput = document.getElementById("btv-from-date");
  var toDateInput = document.getElementById("btv-to-date");
  var loadBtn = document.getElementById("btv-load");

  function ensureChart() {
    if (!state.chart) {
      state.chart = AdminCharts.init(chartEl);
    }
    return state.chart;
  }

  function setStatus(msg, isErr) {
    statusEl.textContent = msg;
    statusEl.classList.toggle("text-danger", !!isErr);
  }

  function showEmpty(msg) {
    AdminCharts.showEmpty(ensureChart(), msg);
  }

  function fmtNum(v, d) {
    if (v === null || v === undefined || isNaN(v)) return "—";
    return Number(v).toFixed(d == null ? 2 : d);
  }

  function fmtTime(t) {
    return String(t).padStart(6, "0").replace(/(\d{2})(\d{2})(\d{2})/, "$1:$2:$3");
  }

  function renderIntraday(data) {
    var chart = ensureChart();
    chart.clear();
    var points = data.points || [];
    if (points.length === 0) {
      showEmpty("No trade points for this filter.");
      return;
    }

    var scatterData = points.map(function (p) { return [p.trade_time, p.price, p.value]; });

    var values = points.map(function (p) { return p.value; });
    var minVal = Math.min.apply(null, values);
    var maxVal = Math.max.apply(null, values);
    var valRange = maxVal - minVal;

    function bubbleSize(v) {
      if (valRange === 0) return 12;
      return 6 + ((v - minVal) / valRange) * 38;
    }

    var option = {
      grid: AdminCharts.grid(),
      tooltip: {
        trigger: "item",
        formatter: function (p) {
          var v = p.value;
          var timeStr = fmtTime(v[0]);
          var priceStr = fmtNum(v[1]);
          var valueStr = fmtNum(v[2]);
          var volStr = v[1] > 0 ? fmtNum(v[2] / v[1], 0) : "—";
          return "<b>Trade</b><br>"
            + "time: " + timeStr + "<br>"
            + "price: " + priceStr + "<br>"
            + "value: " + valueStr + "<br>"
            + "volume: " + volStr;
        }
      },
      xAxis: {
        type: "value",
        name: "Trade time",
        nameLocation: "middle",
        nameGap: 32,
        axisLabel: { formatter: function (v) { return fmtTime(v); } }
      },
      yAxis: {
        type: "value",
        name: "price",
        scale: true
      },
      dataZoom: AdminCharts.dualAxisZoom(),
      series: [{
        type: "scatter",
        data: scatterData,
        symbolSize: function (v) { return bubbleSize(v[2]); },
        itemStyle: { color: "#2563eb" },
        z: 3
      }]
    };
    chart.setOption(option);
  }

  function renderDaily(data) {
    var chart = ensureChart();
    chart.clear();
    var days = data.days || [];
    if (days.length === 0) {
      showEmpty("No trade days for this filter.");
      return;
    }

    var dates = days.map(function (d) { return d.trade_date; });
    var values = days.map(function (d) { return d.value / 1e9; });

    var option = {
      grid: AdminCharts.grid(),
      tooltip: {
        trigger: "item",
        formatter: function (p) {
          return p.name + "<br>value: " + fmtNum(p.value, 2) + " billion";
        }
      },
      xAxis: {
        type: "category",
        data: dates,
        name: "Trade date",
        nameLocation: "middle",
        nameGap: 32
      },
      yAxis: {
        type: "value",
        name: "value (billions)"
      },
      dataZoom: AdminCharts.dualAxisZoom(),
      series: [{
        type: "bar",
        data: values,
        itemStyle: { color: "#2563eb" }
      }]
    };
    chart.setOption(option);
  }

  function loadIntraday() {
    var instrument = instrumentSel.value;
    var date = dateInput.value;
    var limit = limitInput.value;
    if (!instrument || !date) {
      setStatus("Instrument and date are required for intraday mode.", true);
      return;
    }
    var params = "instrument=" + encodeURIComponent(instrument) + "&date=" + encodeURIComponent(date);
    var ft = fromTimeInput.value.trim();
    var tt = toTimeInput.value.trim();
    if (ft) params += "&from_time=" + encodeURIComponent(ft);
    if (tt) params += "&to_time=" + encodeURIComponent(tt);
    if (limit) params += "&limit=" + encodeURIComponent(limit);
    setStatus("Loading intraday trades…");
    showEmpty("Loading…");
    fetch("/api/v1/bond-trades-values/intraday?" + params)
      .then(function (r) { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
      .then(function (data) {
        renderIntraday(data);
        var n = (data.points || []).length;
        var cap = n >= (parseInt(limit) || 2000) ? " (capped)" : "";
        setStatus("Intraday " + instrument + " " + date + " — " + n + " point(s)." + cap);
      })
      .catch(function (err) {
        showEmpty("Failed to load: " + err.message);
        setStatus("Error: " + err.message, true);
      });
  }

  function loadDaily() {
    var instrument = instrumentSel.value;
    var fromD = fromDateInput.value;
    var toD = toDateInput.value;
    if (!instrument || !fromD || !toD) {
      setStatus("Instrument, from and to dates are required for daily mode.", true);
      return;
    }
    var params = "instrument=" + encodeURIComponent(instrument) +
      "&from=" + encodeURIComponent(fromD) +
      "&to=" + encodeURIComponent(toD);
    setStatus("Loading daily trades…");
    showEmpty("Loading…");
    fetch("/api/v1/bond-trades-values/daily?" + params)
      .then(function (r) { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
      .then(function (data) {
        renderDaily(data);
        var n = (data.days || []).length;
        setStatus("Daily " + instrument + " " + fromD + " → " + toD + " — " + n + " day(s).");
      })
      .catch(function (err) {
        showEmpty("Failed to load: " + err.message);
        setStatus("Error: " + err.message, true);
      });
  }

  function onModeChange() {
    var intraday = modeIntraday.checked;
    document.querySelectorAll(".field-intraday").forEach(function (el) { el.classList.toggle("active", intraday); });
    document.querySelectorAll(".field-daily").forEach(function (el) { el.classList.toggle("active", !intraday); });
  }

  modeIntraday.addEventListener("change", onModeChange);
  modeDaily.addEventListener("change", onModeChange);
  loadBtn.addEventListener("click", function () {
    if (modeIntraday.checked) loadIntraday(); else loadDaily();
  });

  showEmpty("Select filters and click Load.");
})();
</script>
{% endblock %}
