{% extends "sqladmin_original/layout.html" %}

{% block head_css %}
{{ super() }}
<style>
  /* Keep category links visibly nested beneath their sidebar section. */
  #navbar-menu .dropdown-menu-column {
    margin-left: 0.75rem;
    padding-left: 0.5rem;
    border-left: 2px solid rgba(255, 255, 255, 0.16);
  }

  #navbar-menu .dropdown-menu-column > .nav-link {
    padding-left: 2.5rem !important;
  }
</style>
<style>
  @media (max-width: 900px) {
    #navbar-menu,
    #navbar-menu .navbar-collapse,
    #navbar-menu .navbar-nav {
      width: 100% !important;
      max-width: 100vw !important;
      min-width: 0 !important;
    }
    #navbar-menu .navbar-nav {
      flex-wrap: wrap !important;
      align-items: flex-start;
    }
    #navbar-menu .nav-item.dropdown {
      flex: 1 1 180px;
      max-width: 220px;
    }
    #navbar-menu .dropdown-menu {
      position: static !important;
      width: 100%;
      min-width: 0;
    }
  }
</style>
{% endblock %}
