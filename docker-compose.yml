services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    container_name: dc-api
    user: "${UID:-1000}:${GID:-1000}" 
    ports:
      - "8000:8000"
    volumes:
      - ./src:/app/src
      - ./pyproject.toml:/app/pyproject.toml
    env_file:
      - .env
    depends_on:
      redis:
        condition: service_started
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    restart: unless-stopped

  celery-worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    container_name: dc-celery-worker
    user: "${UID:-1000}:${GID:-1000}"
    volumes:
      - ./src:/app/src
      - ./pyproject.toml:/app/pyproject.toml
    env_file:
      - .env
    depends_on:
      redis:
        condition: service_started
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    entrypoint: ["/app/entrypoint-celery.sh"]
    command: ["celery", "-A", "src.celery_app", "worker", "--loglevel=info", "--concurrency=1"]
    restart: unless-stopped

  celery-beat:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    container_name: dc-celery-beat
    user: "${UID:-1000}:${GID:-1000}"
    volumes:
      - ./src:/app/src
      - ./pyproject.toml:/app/pyproject.toml
    env_file:
      - .env
    depends_on:
      redis:
        condition: service_started
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    entrypoint: ["/app/entrypoint-celery.sh"]
    command: ["celery", "-A", "src.celery_app", "beat", "--loglevel=info", "--schedule", "/tmp/celerybeat-schedule"]
    restart: unless-stopped

  redis:
    image: redis:latest
    container_name: dc-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  postgres:
    image: postgres:latest
    container_name: dc-postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=dc_user
      - POSTGRES_PASSWORD=dc_pass
      - POSTGRES_DB=dc_metadata
    volumes:
      - postgres_data2:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dc_user -d dc_metadata"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  clickhouse:
    image: clickhouse/clickhouse-server:latest
    container_name: dc-clickhouse
    ports:
      - "8123:8123"
      - "9000:9000"
    environment:
      - CLICKHOUSE_USER=default
      - CLICKHOUSE_PASSWORD=clickhouse
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8123/ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data2:
  clickhouse_data: