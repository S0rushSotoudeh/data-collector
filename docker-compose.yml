x-app-build: &app-build
  context: .
  dockerfile: Dockerfile
  target: development
  args:
    PYTHON_VERSION: "${PYTHON_VERSION}"
    APP_PORT: "${APP_PORT}"
    APP_USER: "${APP_USER}"
    PIP_PACKAGE: "${PIP_PACKAGE}"
    UV_PACKAGE: "${UV_PACKAGE}"
    PYTHONUNBUFFERED: "${PYTHONUNBUFFERED}"
    PYTHONDONTWRITEBYTECODE: "${PYTHONDONTWRITEBYTECODE}"

x-app-volumes: &app-volumes
  - ./src:/app/src
  - ./pyproject.toml:/app/pyproject.toml

x-app-depends-on: &app-depends-on
  redis:
    condition: service_started
  postgres:
    condition: service_healthy
  clickhouse:
    condition: service_healthy

services:
  api:
    build: *app-build
    container_name: "${API_CONTAINER_NAME}"
    user: "${UID}:${GID}"
    ports:
      - "${API_BIND_HOST}:${APP_PORT}:${APP_PORT}"
    volumes:
      - ./src:/app/src
      - ./pyproject.toml:/app/pyproject.toml
      - ./explore-data-sources:/app/explore-data-sources
    env_file: .env
    depends_on: *app-depends-on
    restart: "${RESTART_POLICY}"

  celery-worker:
    build: *app-build
    container_name: "${CELERY_WORKER_CONTAINER_NAME}"
    user: "${UID}:${GID}"
    volumes: *app-volumes
    env_file: .env
    depends_on: *app-depends-on
    entrypoint: ["/app/entrypoint-celery.sh"]
    command:
      [
        "celery",
        "-A",
        "src.celery_app",
        "worker",
        "--loglevel=${CELERY_LOG_LEVEL}",
        "--concurrency=${CELERY_WORKER_CONCURRENCY}",
      ]
    restart: "${RESTART_POLICY}"

  celery-beat:
    build: *app-build
    container_name: "${CELERY_BEAT_CONTAINER_NAME}"
    user: "${UID}:${GID}"
    volumes: *app-volumes
    env_file: .env
    depends_on: *app-depends-on
    entrypoint: ["/app/entrypoint-celery.sh"]
    command:
      [
        "celery",
        "-A",
        "src.celery_app",
        "beat",
        "--loglevel=${CELERY_LOG_LEVEL}",
        "--schedule",
        "/tmp/celerybeat-schedule",
      ]
    restart: "${RESTART_POLICY}"

  redis:
    image: "${REDIS_IMAGE}"
    container_name: "${REDIS_CONTAINER_NAME}"
    command: ["redis-server", "--port", "${REDIS_PORT}"]
    ports:
      - "${REDIS_BIND_HOST}:${REDIS_HOST_PORT}:${REDIS_PORT}"
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "${REDIS_PORT}", "ping"]
      interval: "${HEALTHCHECK_INTERVAL}"
      timeout: "${HEALTHCHECK_TIMEOUT}"
      retries: ${HEALTHCHECK_RETRIES}
    restart: "${RESTART_POLICY}"

  postgres:
    image: "${POSTGRES_IMAGE}"
    container_name: "${POSTGRES_CONTAINER_NAME}"
    command: ["postgres", "-p", "${POSTGRES_PORT}"]
    ports:
      - "${POSTGRES_BIND_HOST}:${POSTGRES_HOST_PORT}:${POSTGRES_PORT}"
    environment:
      POSTGRES_USER: "${POSTGRES_USER}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
      POSTGRES_DB: "${POSTGRES_DB}"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -h ${HEALTHCHECK_HOST} -p ${POSTGRES_PORT} -U ${POSTGRES_USER} -d ${POSTGRES_DB}",
        ]
      interval: "${HEALTHCHECK_INTERVAL}"
      timeout: "${HEALTHCHECK_TIMEOUT}"
      retries: ${HEALTHCHECK_RETRIES}
    restart: "${RESTART_POLICY}"

  clickhouse:
    image: "${CLICKHOUSE_IMAGE}"
    container_name: "${CLICKHOUSE_CONTAINER_NAME}"
    ports:
      - "${CLICKHOUSE_BIND_HOST}:${CLICKHOUSE_HTTP_HOST_PORT}:${CLICKHOUSE_PORT}"
      - "${CLICKHOUSE_BIND_HOST}:${CLICKHOUSE_NATIVE_HOST_PORT}:${CLICKHOUSE_NATIVE_PORT}"
    environment:
      CLICKHOUSE_USER: "${CLICKHOUSE_USER}"
      CLICKHOUSE_PASSWORD: "${CLICKHOUSE_PASSWORD}"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--spider",
          "-q",
          "http://${HEALTHCHECK_HOST}:${CLICKHOUSE_PORT}/ping",
        ]
      interval: "${HEALTHCHECK_INTERVAL}"
      timeout: "${HEALTHCHECK_TIMEOUT}"
      retries: ${HEALTHCHECK_RETRIES}
    restart: "${RESTART_POLICY}"

  flower:
    build: *app-build
    container_name: "${FLOWER_CONTAINER_NAME}"
    user: "${UID}:${GID}"
    ports:
      - "${FLOWER_BIND_HOST}:${FLOWER_HOST_PORT}:${FLOWER_PORT}"
    volumes: *app-volumes
    env_file: .env
    depends_on:
      redis:
        condition: service_started
    entrypoint: ["/app/entrypoint-celery.sh"]
    command:
      [
        "celery",
        "-A",
        "src.celery_app",
        "flower",
        "--port=${FLOWER_PORT}",
        "--broker=${REDIS_URL}",
        "--basic-auth=${FLOWER_BASIC_AUTH}",
      ]
    restart: "${RESTART_POLICY}"

  dbgate:
    image: "${DBGATE_IMAGE}"
    container_name: "${DBGATE_CONTAINER_NAME}"
    ports:
      - "${DBGATE_BIND_HOST}:${DBGATE_HOST_PORT}:${DBGATE_PORT}"
    volumes:
      - dbgate_data:/root/.local/share/dbgate
    depends_on:
      redis:
        condition: service_started
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    restart: "${RESTART_POLICY}"

  qa:
    build:
      <<: *app-build
      target: qa
    user: "${UID}:${GID}"
    working_dir: /app
    environment:
      E2E_BASE_URL: "${E2E_BASE_URL:-https://data.nita.info}"
      E2E_USERNAME: "${E2E_USERNAME:-}"
      E2E_PASSWORD: "${E2E_PASSWORD:-}"
      E2E_ARTIFACT_DIR: /app/qa/artifacts
      E2E_ENABLE_STATEFUL: "${E2E_ENABLE_STATEFUL:-}"
      E2E_STAGE_TRADE_DATE: "${E2E_STAGE_TRADE_DATE:-2026-08-11}"
      E2E_PARITY_RUN_ID: "${E2E_PARITY_RUN_ID:-fd8a8204-e7a3-4a89-9770-3b7f05087bc9}"
      E2E_BOX_RUN_ID: "${E2E_BOX_RUN_ID:-77b8c867-f1e6-4d88-9001-b0c0dd1b606f}"
      E2E_IV_RUN_ID: "${E2E_IV_RUN_ID:-7e2253eb-716a-4076-9fc6-1e71e8fb732c}"
      E2E_MISPRICING_RUN_ID: "${E2E_MISPRICING_RUN_ID:-646492eb-0410-4a4a-83cb-fd07b624cb73}"
      QA_MAX_FAILURE_RATIO: "${QA_MAX_FAILURE_RATIO:-0.01}"
      QA_MAX_P95_MS: "${QA_MAX_P95_MS:-10000}"
    volumes:
      - ./qa:/app/qa
    entrypoint: ["uv", "run"]
    command: ["pytest"]
    profiles: ["qa"]

volumes:
  postgres_data:
  clickhouse_data:
  dbgate_data:
