services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    container_name: dc-api
    user: "${UID:-1000}:${GID:-1000}" 
    ports:
      - "8000:8000"
    volumes:
      # Mount source code for hot-reload during development
      - ./src:/app/src
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=dc_user
      - POSTGRES_PASSWORD=dc_pass
      - POSTGRES_DB=dc_metadata
      - CLICKHOUSE_HOST=clickhouse
      - CLICKHOUSE_PORT=9000
    depends_on:
      redis:
        condition: service_started
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    restart: unless-stopped

  redis:
    image: redis:latest
    container_name: dc-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  postgres:
    image: postgres:latest
    container_name: dc-postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=dc_user
      - POSTGRES_PASSWORD=dc_pass
      - POSTGRES_DB=dc_metadata
    volumes:
      - postgres_data2:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dc_user -d dc_metadata"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  clickhouse:
    image: clickhouse/clickhouse-server:latest
    container_name: dc-clickhouse
    ports:
      - "8123:8123"   # HTTP interface
      - "9000:9000"   # Native TCP interface
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8123/ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data2:
  clickhouse_data: