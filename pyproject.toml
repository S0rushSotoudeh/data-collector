[project]
name = "data-collector"
version = "0.1.0"
description = "Data collection and analytics platform for HFT research"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "aiohttp>=3.11",
    "fastapi",
    "uvicorn[standard]",
    "sqlalchemy>=2.0",
    "alembic>=1.14",
    "psycopg2-binary>=2.9",
    "httpx>=0.28.1",
    "sqlmodel>=0.0.38",
    "ipython>=9.14.1",
    "clickhouse-connect>=0.8",
    "sqladmin[full]>=0.27",
    "celery[redis]>=5.4",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[project.optional-dependencies]
analytics = ["scipy>=1.15"]
flower = ["flower>=2.0"]
all = ["scipy>=1.15", "flower>=2.0"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
cache_dir = "/tmp/pytest_cache"
filterwarnings = [
    "ignore::DeprecationWarning:importlib",
]
